{% extends "base.html" %}

{% block title %}Login | ShowCase{% endblock %}

{% block content %}

<section class="card auth-card">


<p class="eyebrow">WELCOME BACK</p>

<h1>Login to ShowCase</h1>

<p class="muted">
    Access your personal code collection.
</p>

<form method="POST" class="form-grid">

    <label class="full">
        Mobile Number
        <input
            type="tel"
            name="mobile"
            placeholder="Enter your 10-digit mobile number"
            pattern="[0-9]{10}"
            minlength="10"
            maxlength="10"
            inputmode="numeric"
            required
        >
    </label>

    <label class="full">
        Six-Digit Password

        <div class="password-field">
            <input
                type="password"
                name="password"
                id="loginPassword"
                placeholder="Enter your password"
                inputmode="numeric"
                maxlength="6"
                required
            >

            <button
                type="button"
                class="show-password"
                data-toggle-password="loginPassword"
            >
                Show
            </button>
        </div>
    </label>

    <button class="btn full" type="submit">
        Login
    </button>

</form>

<p class="switch">
    Don't have an account?
    <a href="{{ url_for('register') }}">Create account</a>
</p>


</section>

{% endblock %}
