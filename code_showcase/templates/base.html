<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>{% block title %}ShowCase{% endblock %}</title>

<link rel="stylesheet" href="{{ url_for('static', filename='showcase-logo-transparent.png') }}">


</head>

<body>

<header class="topbar">

    <a class="brand" href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='showcase-logo-transparent.png') }}"
             alt="The ShowCase Logo">
    </a>

</header>

<main class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<footer>
    © 2026 ShowCase [sagar raj] · Built to showcase your code
</footer>

<script>
    document.querySelectorAll("[data-toggle-password]").forEach(button => {
        button.addEventListener("click", () => {
            const input = document.getElementById(button.dataset.togglePassword);

            input.type = input.type === "password" ? "text" : "password";

            button.textContent = input.type === "password" ? "Show" : "Hide";
        });
    });
</script>


</body>
</html>
