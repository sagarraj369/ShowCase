{% extends "base.html" %}

{% block title %}Add Code | ShowCase{% endblock %}

{% block content %}

<section class="card">

    <p class="eyebrow">MY COLLECTION</p>
    <h1>Add New Code</h1>

    <form method="POST" class="form-grid">

        <label class="full">
            Code Title
            <input
                type="text"
                name="title"
                placeholder="Example: My First Project"
                required
            >
            <small>The .sr extension will be added automatically.</small>
        </label>

        <label class="full">
            Programming Language

            <select name="language" required>
                <option value="">Select language</option>
                <option>HTML</option>
                <option>Python</option>
                <option>CSS</option>
                <option>JavaScript</option>
                <option>Java</option>
                <option>TypeScript</option>
                <option>C</option>
                <option>C++</option>
                <option>C#</option>
                <option>PHP</option>
            </select>
        </label>

        <label class="full">
            Your Code
            <textarea
                name="code"
                rows="15"
                placeholder="Write or paste your code here..."
                required
            ></textarea>
        </label>

        <div class="form-actions full">
            <button type="submit" class="btn">Save Code</button>
            <a href="{{ url_for('profile') }}" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>

</section>

{% endblock %}
